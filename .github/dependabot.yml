version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      minor-updates:
        update-types: [minor, patch]
    ignore:
      # Major bumps are reviewed manually.
      - dependency-type: direct
        update-types: version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
